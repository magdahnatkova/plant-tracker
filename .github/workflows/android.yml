name: Android app

on:
  push:
    paths:
      - index.html
      - android/**
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk plant-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: plant-tracker-apk
          path: plant-tracker.apk

      # Builds from main replace the APK on the "android" release, which keeps a fixed download link.
      - name: Publish to release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || \
            gh release create android --title "Android app" --notes "Install plant-tracker.apk on an Android phone."
          gh release upload android plant-tracker.apk --clobber
